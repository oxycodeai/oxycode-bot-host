<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body style="background: #09090b; color: #e4e4e7; min-height: 100vh;" class="font-sans antialiased">
    <!-- Telegram Popup -->
    {% include 'components/popup.html' %}

    <!-- Top Navigation -->
    <nav class="nav-bar sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Mobile Menu Button -->
                <button onclick="toggleMobileMenu()" class="sm:hidden btn-icon" style="min-width: 40px; min-height: 40px;">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <a href="/" class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);">
                        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="font-bold text-base tracking-tight hidden sm:block" style="color: #f4f4f5;">
                        OXYCODE <span style="color: #60a5fa;">HOST</span>
                    </span>
                </a>
            </div>

            <div class="flex items-center gap-2">
                <!-- User Info -->
                <div class="hidden sm:flex items-center gap-2 text-xs px-3 py-1.5 rounded-lg" style="color: #a1a1aa; background: rgba(255, 255, 255, 0.03);">
                    <div class="w-2 h-2 rounded-full" style="background: #22c55e; animation: pulse-green 2s infinite;"></div>
                    <span id="user-name">{{ user_name }}</span>
                </div>

                <!-- New Bot Button -->
                <a href="/create" class="btn-create">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span class="hidden sm:inline">New Bot</span>
                </a>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden sm:hidden" style="border-top: 1px solid rgba(255, 255, 255, 0.06);">
            <div class="px-4 py-3 space-y-1">
                <a href="/" class="mobile-menu-item">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Dashboard
                </a>
                <div class="flex items-center gap-2 px-3 py-2.5 text-xs" style="color: #71717a;">
                    <div class="w-2 h-2 rounded-full" style="background: #22c55e; animation: pulse-green 2s infinite;"></div>
                    <span>{{ user_name }}</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-5 pb-20 sm:pb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="sm:hidden fixed bottom-0 left-0 right-0 z-40 safe-bottom" style="background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.06);">
        <div class="flex items-center justify-around h-14">
            <a href="/" class="bottom-nav-item {% if request.path == '/' %}active{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="/create" class="bottom-nav-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span>New Bot</span>
            </a>
        </div>
    </nav>

    <script src="/static/js/popup.js"></script>
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
