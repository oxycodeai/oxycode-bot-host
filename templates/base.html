<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#09090b',
                            surface: '#18181b',
                            border: '#27272a',
                            card: '#1c1c1f',
                        },
                        accent: '#3b82f6'
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-dark-bg text-zinc-100 min-h-screen font-sans">
    {% include 'components/popup.html' %}

    <nav class="border-b border-dark-border bg-dark-surface/80 backdrop-blur-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <span class="text-lg font-bold tracking-tight">
                    <span class="text-accent">OXYCODE</span> BOT HOST
                </span>
                <span class="text-[10px] bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded font-mono">v1.0</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="/" class="text-sm text-zinc-400 hover:text-zinc-100 transition-colors">Dashboard</a>
                <a href="/create" class="text-sm bg-accent hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg transition-colors font-medium">+ New Bot</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-dark-border mt-8">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between text-xs text-zinc-500">
            <span>OXYCODE BOT HOST - Lightweight Termux Hosting</span>
            <a href="https://t.me/OXYCODEAI" target="_blank" class="hover:text-accent transition-colors">Join Telegram</a>
        </div>
    </footer>

    <script src="/static/js/popup.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
