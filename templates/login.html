{% extends "base.html" %}
{% block title %}Login - {{ app_name }}{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card p-8 w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3" style="background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(59, 130, 246, 0.2)); border: 1px solid rgba(168, 85, 247, 0.15);">
                <svg class="w-7 h-7" style="color: #c084fc;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-lg font-bold" style="color: #f4f4f5;">Welcome Back</h1>
            <p class="text-sm mt-1" style="color: #71717a;">Enter password to access dashboard</p>
        </div>
        {% if error %}
        <div class="mb-4 p-3 rounded-lg text-sm" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5;">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST">
            <div class="mb-4">
                <input type="password" name="password" placeholder="Password" autofocus required
                    class="w-full px-4 py-3 rounded-xl text-sm outline-none transition-colors"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #f4f4f5;">
            </div>
            <button type="submit" class="btn-create w-full justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
