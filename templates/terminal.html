{% extends "base.html" %}
{% block title %}Terminal - {{ project.name }}{% endblock %}

{% block content %}
<!-- Header -->
<div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
        <a href="/" class="btn-icon">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div>
            <h1 class="text-sm font-semibold">{{ project.name }} - Terminal</h1>
            <p class="text-[11px] text-zinc-600">Execute commands in bot directory</p>
        </div>
    </div>
</div>

<!-- Terminal -->
<div class="card p-0 overflow-hidden">
    <div class="flex items-center gap-2 px-4 py-2.5 border-b border-white/[0.04]">
        <div class="flex gap-1.5">
            <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
        </div>
        <span class="text-[11px] text-zinc-600 font-mono ml-2">{{ project.name }}@terminal</span>
        <button onclick="clearTerminal()" class="ml-auto action-btn action-delete text-[10px]">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
            Clear
        </button>
    </div>
    <div id="terminal-output" class="log-viewer min-h-[300px] max-h-[500px] overflow-y-auto p-4 font-mono text-sm" style="background: #09090b;">
        <div id="terminal-history"></div>
        <div class="flex items-center gap-2 mt-2">
            <span style="color: #22c55e;">$</span>
            <input type="text" id="terminal-input" class="flex-1 bg-transparent outline-none font-mono text-sm" style="color: #f4f4f5;" placeholder="Enter command..." autofocus>
        </div>
    </div>
</div>

<!-- Quick Commands -->
<div class="mt-4">
    <p class="text-[11px] text-zinc-500 mb-2">Quick Commands</p>
    <div class="flex flex-wrap gap-2">
        <button onclick="runQuickCmd('pip install -r requirements.txt')" class="action-btn action-edit text-[10px]">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            pip install
        </button>
        <button onclick="runQuickCmd('npm install')" class="action-btn action-edit text-[10px]">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            npm install
        </button>
        <button onclick="runQuickCmd('ls -la')" class="action-btn action-edit text-[10px]">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            ls -la
        </button>
        <button onclick="runQuickCmd('python --version')" class="action-btn action-edit text-[10px]">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            python --version
        </button>
        <button onclick="runQuickCmd('node --version')" class="action-btn action-edit text-[10px]">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            node --version
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.PROJECT_ID = {{ project.id }};
    
    const input = document.getElementById('terminal-input');
    const history = document.getElementById('terminal-history');
    const output = document.getElementById('terminal-output');
    let commandHistory = [];
    let historyIndex = -1;

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const cmd = input.value.trim();
            if (cmd) {
                commandHistory.unshift(cmd);
                historyIndex = -1;
                executeCommand(cmd);
                input.value = '';
            }
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIndex < commandHistory.length - 1) {
                historyIndex++;
                input.value = commandHistory[historyIndex];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex > 0) {
                historyIndex--;
                input.value = commandHistory[historyIndex];
            } else {
                historyIndex = -1;
                input.value = '';
            }
        }
    });

    async function executeCommand(cmd) {
        const cmdLine = document.createElement('div');
        cmdLine.className = 'flex items-start gap-2 mb-1';
        cmdLine.innerHTML = `<span style="color: #22c55e;">$</span><span style="color: #f4f4f5;">${escapeHtml(cmd)}</span>`;
        history.appendChild(cmdLine);

        const loading = document.createElement('div');
        loading.className = 'text-[11px] ml-4';
        loading.style.color = '#71717a';
        loading.textContent = 'Running...';
        history.appendChild(loading);

        try {
            const res = await fetch(`/api/terminal/${window.PROJECT_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            });
            const data = await res.json();
            loading.remove();

            const resultLine = document.createElement('div');
            resultLine.className = 'ml-4 mb-2 whitespace-pre-wrap text-sm';
            if (data.output) {
                resultLine.style.color = '#a1a1aa';
                resultLine.textContent = data.output;
            } else if (data.error) {
                resultLine.style.color = '#ef4444';
                resultLine.textContent = 'Error: ' + data.error;
            }
            history.appendChild(resultLine);
        } catch (err) {
            loading.remove();
            const errLine = document.createElement('div');
            errLine.className = 'ml-4 mb-2 text-sm';
            errLine.style.color = '#ef4444';
            errLine.textContent = 'Request failed: ' + err.message;
            history.appendChild(errLine);
        }

        output.scrollTop = output.scrollHeight;
    }

    function runQuickCmd(cmd) {
        input.value = cmd;
        input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
    }

    function clearTerminal() {
        history.innerHTML = '';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    input.focus();
</script>
{% endblock %}
