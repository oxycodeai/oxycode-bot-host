{% extends "base.html" %}
{% block title %}Logs - {{ project.name }}{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
        <a href="/" class="text-zinc-500 hover:text-zinc-300 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div>
            <h1 class="text-lg font-semibold">{{ project.name }} - Logs</h1>
            <p class="text-xs text-zinc-500">Auto-refreshing every 3 seconds</p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <label class="flex items-center gap-2 text-xs text-zinc-400">
            <input type="checkbox" id="auto-scroll" checked class="w-3.5 h-3.5 rounded border-zinc-600 bg-zinc-800 text-accent">
            Auto-scroll
        </label>
        <button onclick="clearLogs()" class="btn-ghost text-xs text-red-400">Clear</button>
        <button onclick="refreshLogs()" class="btn-secondary text-xs">Refresh</button>
    </div>
</div>

<div class="card p-0 overflow-hidden">
    <pre id="log-output" class="log-viewer rounded-none border-0">Loading logs...</pre>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.PROJECT_ID = {{ project.id }};
</script>
<script src="/static/js/logs.js"></script>
{% endblock %}
