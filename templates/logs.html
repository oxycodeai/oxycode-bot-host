{% extends "base.html" %}
{% block title %}Logs - {{ project.name }}{% endblock %}

{% block content %}
<!-- Header -->
<div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
        <a href="/" class="btn-icon">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div>
            <h1 class="text-sm font-semibold">{{ project.name }} - Logs</h1>
            <p class="text-[11px] text-zinc-600">Auto-refreshing every 3s</p>
        </div>
    </div>
    <div class="flex items-center gap-1.5">
        <label class="hidden sm:flex items-center gap-1.5 text-[11px] text-zinc-500 bg-white/[0.03] px-2.5 py-1.5 rounded-lg border border-white/[0.04] cursor-pointer">
            <input type="checkbox" id="auto-scroll" checked class="w-3 h-3 rounded border-zinc-600 bg-zinc-800 text-blue-500">
            Auto-scroll
        </label>
        <button onclick="clearLogs()" class="action-btn action-delete">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
            Clear
        </button>
        <button onclick="refreshLogs()" class="action-btn action-edit">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Refresh
        </button>
    </div>
</div>

<!-- Log Terminal -->
<div class="card p-0 overflow-hidden">
    <div class="flex items-center gap-2 px-4 py-2.5 border-b border-white/[0.04]">
        <div class="flex gap-1.5">
            <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
        </div>
        <span class="text-[11px] text-zinc-600 font-mono ml-2">{{ project.name }}.log</span>
        <div class="ml-auto flex items-center gap-1.5">
            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" id="log-status"></div>
            <span class="text-[10px] text-zinc-600" id="log-status-text">Live</span>
        </div>
    </div>
    <pre id="log-output" class="log-viewer rounded-none border-0 min-h-[400px]">Loading logs...</pre>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.PROJECT_ID = {{ project.id }};
</script>
<script src="/static/js/logs.js"></script>
{% endblock %}
